<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="claude-toc — a table of contents for long Claude Code sessions">
  <title>claude-toc</title>
  <style>
    text { white-space: pre; font-family: 'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 15px; fill: #d4be98; }
    .t  { font-size: 26px; font-weight: 700; fill: #89b482; letter-spacing: 2px; }
    .tg { font-size: 13px; fill: #928374; }
    .h  { fill: #d8a657; font-weight: 700; }
    .k  { fill: #d8a657; }
    .d  { fill: #928374; }
    .g  { fill: #a9b665; }
    .a  { fill: #89b482; }
    .o  { fill: #e78a4e; }
    .r  { fill: #ea6962; }
    .p  { fill: #d3869b; }
    .b  { fill: #7daea3; }
    .art { font-size: 14px; }
  </style>
  <!-- the card -->
  <rect x="0" y="0" width="960" height="300" rx="6" fill="#1d2021"/>
  <rect x="14" y="20" width="932" height="236" fill="#282828" stroke="#7c6f64" stroke-width="1.5"/>
  <rect x="20" y="26" width="920" height="224" fill="none" stroke="#45403d" stroke-width="1"/>
  <!-- title set into the top border -->
  <rect x="40" y="6" width="262" height="30" fill="#282828"/>
  <text x="50" y="30"><tspan class="d">┤</tspan><tspan class="t"> CLAUDE-TOC </tspan><tspan class="d">├</tspan></text>
  <!-- a tag set into the bottom border -->
  <rect x="744" y="244" width="182" height="22" fill="#282828"/>
  <text x="750" y="260" class="tg">┤ v0.1 · GPL-3.0 · mod ├</text>

  <!-- portrait: the sidebar itself, in miniature -->
  <rect x="44" y="52" width="232" height="182" fill="#32302f" stroke="#504945"/>
  <text class="art" x="56" y="76"><tspan class="d">1─┤</tspan> Context <tspan class="d">────── 3/4</tspan></text>
  <text class="art" x="56" y="96"><tspan class="d">2━┥</tspan><tspan class="h"> Plan </tspan><tspan class="d">── </tspan><tspan class="g">▰▰▰▰</tspan><tspan class="d">▱▱</tspan></text>
  <text class="art" x="56" y="116"><tspan class="d">▸</tspan> M1 Spikes <tspan class="d">     8/8</tspan><tspan class="g"> ✓</tspan></text>
  <text class="art" x="56" y="136"><tspan class="d">▾</tspan> M2 The model <tspan class="d"> 3/5</tspan></text>
  <text class="art" x="56" y="156">  <tspan class="g">✓</tspan> S2.1 Parser <tspan class="a">   ⇡2</tspan></text>
  <text class="art" x="56" y="176">  <tspan class="o">◐</tspan> S2.2 Diagnostics</text>
  <text class="art" x="56" y="196"><tspan class="d">3─┤</tspan> Artifacts <tspan class="a">  ⇡2 +1</tspan></text>
  <text class="art" x="56" y="216"><tspan class="d">4─┤</tspan> Preview <tspan class="r">  -3</tspan><tspan class="g"> +7</tspan></text>

  <!-- the character sheet -->
  <text x="304" y="74" class="h">A table of contents for long Claude Code sessions.</text>
  <text x="304" y="100" class="d">Where the knowledge lives, how far the plan has got, and which</text>
  <text x="304" y="120" class="d">commits and files each step produced — read from the files.</text>
  <text x="304" y="156"><tspan class="b">CONTEXT   </tspan> SPEC · DEV_PLAN · KNOWLEDGE, with their age</text>
  <text x="304" y="178"><tspan class="g">PLAN      </tspan> milestones → steps <tspan class="g">✓</tspan> <tspan class="o">◐</tspan> <tspan class="d">○ ✗</tspan>, acceptance <tspan class="d">☐2/3</tspan></text>
  <text x="304" y="200"><tspan class="a">ARTIFACTS </tspan> each step's commits <tspan class="a">⇡</tspan> and files <tspan class="a">+</tspan>, by trailer</text>
  <text x="304" y="222"><tspan class="p">PREVIEW   </tspan> diffs and plan briefs, wrapped and paged</text>

  <!-- the [key] footer -->
  <text x="22" y="288"><tspan class="k">[^X T]</tspan> toc  <tspan class="k">[j k]</tspan> move  <tspan class="k">[l h]</tspan> drill  <tspan class="k">[o]</tspan> open  <tspan class="k">[d]</tspan> delta  <tspan class="k">[v]</tspan> lazygit  <tspan class="k">[p]</tspan> plan  <tspan class="k">[5]</tspan> keys  <tspan class="k">[q]</tspan> close</text>
</svg>
